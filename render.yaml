services:
  - type: web
    name: video-text-detection-api
    env: python
    plan: free  # or starter/standard for better performance
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app --timeout 300 --workers 1 --threads 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_VIDEO_DURATION
        value: "300"  # 5 minutes for free tier
      - key: DOWNLOAD_TIMEOUT
        value: "180"   # 3 minutes
      - key: PYTHON_VERSION
        value: "3.9"
    disk:
      name: video-processing-disk
      mountPath: /tmp
      sizeGB: 1